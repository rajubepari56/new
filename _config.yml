title: Raju Bepari
tagline: Google Ads, Conversion Tracking & Web Analytics Specialist
description: Google Ads, GA4, GTM and server-side tracking for US, UK and AU businesses. 7+ years of hands-on experience. Message me on WhatsApp.
lang: en
url: "https://rajubepari.netlify.app"
baseurl: ""
permalink: /blog/:title/

author:
  name: Raju Bepari
  email: rajubepari56@gmail.com
  twitter: Raju_seo_

# WhatsApp number: country code + number, no "+" (TODO: set real number)

# Tracking IDs. Leave empty to disable. GTM loads only if gtm_id is set.

# Hero progress bars. Set display/count to your real numbers; empty items are hidden.

# Real certifications only, e.g. "Google Ads Search certified". Never list Google Partner unless you are one.


plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

twitter:
  username: Raju_seo_
  card: summary_large_image
social:
  name: Raju Bepari
  links:
    - "https://www.linkedin.com/in/rajubepari0-seo-expert/"

defaults:
  - scope: { path: "", type: "posts" }
    values: { layout: "post", image: "/assets/images/og-image.png" }
  - scope: { path: "" }
    values: { layout: "default", image: "/assets/images/og-image.png" }
  - scope: { path: "services", type: "pages" }
    values: { layout: "service" }

exclude: [netlify.toml, netlify, package.json, package-lock.json, node_modules, ADMIN-SETUP.md, BRIEF.md, TODO.md, QA-REPORT.md, README.md, scripts, Gemfile, Gemfile.lock, vendor]
