# Decap CMS: edit blog posts, settings, reviews, case studies and snapshots from /admin/ (needs the site deployed from Git and a GitHub OAuth app on Netlify).
backend:
  name: github
  repo: rajubepari56/new
  branch: claude/raju-bepari-website-build-uj8gvc
  base_url: https://api.netlify.com
  auth_endpoint: auth

publish_mode: simple
media_folder: assets/images/blog
public_folder: /assets/images/blog
site_url: https://rajubepari.netlify.app
display_url: https://rajubepari.netlify.app

collections:
  - name: blog
    label: Blog posts
    label_singular: Blog post
    folder: _posts
    create: true
    extension: md
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} ({{category}})"
    sortable_fields: ["date", "title"]
    fields:
      - { label: Title (keep under 46 characters), name: title, widget: string }
      - { label: Short description (under 155 characters), name: description, widget: text }
      - { label: Publish date, name: date, widget: datetime, format: "YYYY-MM-DD HH:mm:ss ZZ", date_format: "YYYY-MM-DD", time_format: "HH:mm" }
      - { label: Category, name: category, widget: select, options: ["Google Ads", "Analytics", "Tracking", "Local SEO", "AI Search"] }
      - { label: Feature image (1200x630 WebP, shown on the post and cards), name: feature, widget: image, required: false }
      - { label: Feature image for social sharing (1200x630 JPG), name: image, widget: image, required: false }
      - { label: Feature image description (alt text), name: feature_alt, widget: string, required: false }
      - { label: Author, name: author, widget: string, default: Raju Bepari }
      - label: Related services
        name: services
        widget: select
        multiple: true
        required: false
        options:
          - { label: Google Ads Management, value: google-ads }
          - { label: GA4 Setup & Audit, value: ga4 }
          - { label: Google Tag Manager, value: google-tag-manager }
          - { label: Meta Pixel & Conversions API, value: meta-pixel-capi }
          - { label: Server-Side Tracking, value: server-side-tracking }
          - { label: Enhanced & Offline Conversions, value: enhanced-offline-conversions }
          - { label: Google Merchant Center, value: merchant-center }
          - { label: Local SEO, value: local-seo }
          - { label: AI Search Optimization, value: ai-search-optimization }
      - { label: Article, name: body, widget: markdown }

  - name: site
    label: Site settings
    files:
      - label: Contact, tracking, hero and socials
        name: settings
        file: _data/settings.yml
        fields:
          - { label: WhatsApp number (country code + number, no +), name: whatsapp, widget: string }
          - { label: Email, name: email, widget: string }
          - { label: Experience (for example 7+ years), name: experience, widget: string }
          - { label: Timezone, name: timezone, widget: string }
          - { label: "Booking link (Cal.com or Calendly URL; empty = audit button opens WhatsApp)", name: booking_url, widget: string, required: false }
          - { label: "Reply time (for example: a few hours; empty hides the line)", name: reply_time, widget: string, required: false }
          - { label: GTM container ID (GTM-XXXXXXX; empty disables tracking), name: gtm_id, widget: string, required: false }
          - { label: GA4 measurement ID (reference only), name: ga4_id, widget: string, required: false }
          - { label: Search Console verification code, name: google_site_verification, widget: string, required: false }
          - label: Hero progress bars (real numbers only)
            name: hero_stats
            widget: list
            fields:
              - { label: Count (number, optional), name: count, widget: number, required: false }
              - { label: Suffix (for example +), name: suffix, widget: string, required: false }
              - { label: "Display text (use instead of count, for example $1.2M+)", name: display, widget: string, required: false }
              - { label: Label, name: label, widget: string }
              - { label: Bar fill percent, name: percent, widget: number, min: 0, max: 100 }
          - label: Certifications (real ones only)
            name: certifications
            widget: list
            required: false
            field: { label: Certification, name: cert, widget: string }
          - label: Social profiles
            name: socials
            widget: object
            fields:
              - { label: Upwork, name: upwork, widget: string, required: false }
              - { label: LinkedIn, name: linkedin, widget: string, required: false }
              - { label: Facebook, name: facebook, widget: string, required: false }
              - { label: Instagram, name: instagram, widget: string, required: false }
              - { label: X, name: x, widget: string, required: false }
              - { label: Medium, name: medium, widget: string, required: false }

  - name: proof
    label: Reviews and results
    files:
      - label: Client reviews (exact quotes only)
        name: reviews
        file: _data/reviews.yml
        fields:
          - label: Reviews
            name: items
            widget: list
            summary: "{{fields.project}} ({{fields.date}})"
            fields:
              - { label: Project name, name: project, widget: string }
              - { label: Date (for example Sep 2026), name: date, widget: string }
              - { label: Note (for example Second review from the same client), name: repeat, widget: string, required: false }
              - { label: Review text (exact quote), name: text, widget: text }
      - label: Result snapshots (Google Ads screenshots)
        name: snapshots
        file: _data/snapshots.yml
        fields:
          - label: Snapshots
            name: items
            widget: list
            summary: "{{fields.headline}}"
            fields:
              - { label: Image path, name: img, widget: image }
              - { label: Alt text, name: alt, widget: text }
              - { label: Headline, name: headline, widget: string }
              - label: Stats (copy exactly from the screenshot)
                name: stats
                widget: list
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Value, name: value, widget: string }
      - label: Case studies still to come (placeholder cards)
        name: coming_soon
        file: _data/coming_soon.yml
        fields:
          - label: Cards
            name: items
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Tag, name: tag, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Note, name: note, widget: string }

  - name: case_studies
    label: Case studies
    label_singular: Case study
    folder: _case_studies
    create: true
    extension: md
    slug: "{{slug}}"
    summary: "{{title}} ({{industry}}, {{country}})"
    fields:
      - { label: Title (outcome-led, no client name unless permitted), name: title, widget: string }
      - { label: Search description, name: description, widget: text }
      - { label: Order on the page (1 = first), name: order, widget: number, value_type: int, default: 10 }
      - { label: Tag (for example Google Ads · E-commerce), name: tag, widget: string }
      - { label: Industry, name: industry, widget: string }
      - { label: Country, name: country, widget: string }
      - { label: Anonymized client description, name: client_label, widget: string }
      - { label: Client name (leave empty unless the client gave permission), name: client_name, widget: string, required: false }
      - { label: Client confirmed permission to show their name, name: name_permission, widget: boolean, default: false }
      - { label: Timeframe, name: timeframe, widget: string }
      - { label: Summary, name: summary, widget: text }
      - label: Headline result (shown on cards)
        name: headline
        widget: object
        fields:
          - { label: Value (for example 4x or A$0.20), name: value, widget: string }
          - { label: Label, name: label, widget: string }
          - { label: Context (timeframe and setting), name: context, widget: string }
      - { label: Starting point / baseline (real numbers only), name: baseline, widget: text, required: false }
      - { label: Business challenge, name: challenge, widget: text }
      - { label: What I did (first person), name: work, widget: list, field: { label: Step, name: step, widget: text } }
      - label: Architecture diagram
        name: flow
        widget: object
        required: false
        fields:
          - { label: Diagram title, name: title, widget: string }
          - { label: Note, name: note, widget: text, required: false }
          - label: Stages (left to right; each stage lists the boxes stacked in that column)
            name: stages
            widget: list
            fields:
              - { label: Boxes in this stage, name: boxes, widget: list, field: { label: Box, name: box, widget: string } }
      - { label: Tools used, name: tools, widget: list, field: { label: Tool, name: tool, widget: string } }
      - label: Timeline
        name: timeline
        widget: list
        required: false
        fields:
          - { label: When, name: when, widget: string }
          - { label: What happened, name: what, widget: text }
      - label: Verified outcome metrics
        name: metrics
        widget: list
        summary: "{{fields.label}}: {{fields.value}}"
        fields:
          - { label: Value (after), name: value, widget: string }
          - { label: Before (optional), name: before, widget: string, required: false }
          - { label: Label, name: label, widget: string }
          - { label: Note (optional), name: note, widget: string, required: false }
          - { label: Timeframe (optional), name: timeframe, widget: string, required: false }
          - { label: "This is a real multiplier such as 5X (only tick if supported by data)", name: multiplier, widget: boolean, default: false }
      - { label: Data note (source, caveats), name: data_note, widget: text, required: false }
      - { label: Screenshots heading, name: screens_title, widget: string, required: false }
      - { label: Screenshots note (hidden account IDs, names, personal data), name: screens_note, widget: text, required: false }
      - label: Screenshots (blur account IDs, client names and personal data first)
        name: screens
        widget: list
        required: false
        fields:
          - { label: Image, name: img, widget: image }
          - { label: Width, name: w, widget: number }
          - { label: Height, name: h, widget: number }
          - { label: Alt text, name: alt, widget: text }
          - { label: Caption, name: cap, widget: string }
      - label: Client quote (real only)
        name: quote
        widget: object
        required: false
        fields:
          - { label: Quote (exact words), name: text, widget: text }
          - { label: Name and role (only if permitted), name: who, widget: string }
          - { label: Source (for example Upwork review, date), name: source, widget: string }
      - { label: More detail (optional), name: body, widget: markdown, required: false }
